<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Lista de Tarefas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
    <script src="assets/js/supabase.js"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
</head>

<body class="bg-slate-700 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-slate-800 shadow-lg rounded-lg overflow-hidden border border-slate-700">

        <div class="px-6 py-8">

            <!-- Título -->
            <div class="text-center mb-8">
                <i class="ph-bold ph-user-plus text-cyan-400 text-4xl"></i>

                <h1
                    class="text-3xl mt-3 font-bold bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Criar conta
                </h1>

                <p class="text-slate-400 mt-2">
                    Cadastre-se para começar
                </p>
            </div>

            <!-- Formulário -->
            <form id="registerForm">

                <div class="mb-5">
                    <label for="nome" class="block text-slate-300 mb-2">
                        Nome
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-user text-cyan-400 mr-3"></i>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-5">
                    <label for="email" class="block text-slate-300 mb-2">
                        E-mail
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-envelope text-cyan-400 mr-3"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-5">
                    <label for="senha" class="block text-slate-300 mb-2">
                        Senha
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-lock text-cyan-400 mr-3"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label for="confirmarSenha" class="block text-slate-300 mb-2">
                        Confirmar senha
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-lock-key text-cyan-400 mr-3"></i>

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-cyan-800 hover:bg-cyan-700 text-white font-medium py-3 rounded-lg transition">
                    <i class="ph-bold ph-user-plus mr-2"></i>
                    Criar conta
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-slate-400">
                    Já possui uma conta?
                </p>

                <a href="login.html"
                    class="inline-block mt-2 text-cyan-400 hover:text-cyan-300 font-medium">
                    Fazer login
                </a>
            </div>

        </div>

    </div>

     <script>

        async function createUser() {
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            console.log("Nome:", nome);
            console.log("Email:", email);
            console.log("Senha:", password);

            const { data, error } = await supabaseClient
                .from('users')
                .insert([
                    { name: nome, email: email, password: password }
                ])

            if (error) {
                console.error('Erro ao criar usuário:', error)
            } else {
                console.log('Usuário criado com sucesso:', data)
            }

            event.preventDefault();

            window.location.replace("login.html");

            // document.getElementById("myForm").submit();

        }




        // console.log(SUPABASE_URL)
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="assets/js/api.js"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
</head>

<body class="bg-slate-700 min-h-screen px-4 py-10">

    <!-- CONTAINER PRINCIPAL -->
    <div class="w-full max-w-md mx-auto bg-slate-800 shadow-lg rounded-lg overflow-hidden border border-slate-700">

        <div class="px-6 py-8">

            <!-- CABEÇALHO -->
            <div class="text-center mb-8">

                <i class="ph-bold ph-check-circle text-cyan-400 text-4xl"></i>

                <h1
                    class="text-3xl mt-3 font-bold bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Lista de Tarefas
                </h1>

                <p class="text-slate-400 mt-2">
                    Organize suas tarefas
                </p>
                <p id="userLabel" class="text-cyan-300 text-sm mt-2"></p>
                <button id="logout" type="button" class="text-slate-400 hover:text-white text-sm mt-2">
                    Sair
                </button>

            </div>


            <!-- CAMPO DE NOVA TAREFA -->
            <form id="taskForm" class="mb-8">

                <label for="tarefa" class="block text-slate-300 mb-2">
                    Nova tarefa
                </label>

                <div class="flex items-center border-b-2 border-cyan-800 py-2">

                    <i class="ph-bold ph-pencil-simple text-cyan-400 mr-3"></i>

                    <input
                        placeholder="Digite sua tarefa..."
                        type="text"
                        name="tarefa"
                        id="tarefa"
                        required
                        class="appearance-none bg-transparent border-none w-full text-slate-100 mr-3 py-1 px-2 leading-tight focus:outline-none placeholder-slate-500">

                    <button
                        type="submit"
                        id="criar"
                        class="flex-shrink-0 bg-cyan-800 hover:bg-cyan-700 text-white p-2 rounded-lg transition"
                        title="Adicionar tarefa">

                        <i class="ph-bold ph-plus"></i>

                    </button>

                </div>

            </form>

            <p id="taskError" role="alert" class="text-red-300 text-sm mb-4" hidden></p>


            <!-- LISTA DE TAREFAS -->
            <div>

                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-100">
                            Minhas tarefas
                        </h2>
                        <p id="taskProgress" class="text-xs text-slate-400 mt-1">
                            Tudo em dia
                        </p>
                    </div>
                    <span id="taskCount" class="text-xs font-semibold text-cyan-200 bg-cyan-950 border border-cyan-800 px-3 py-1.5 rounded-full">
                        0 tarefas
                    </span>

                </div>

                <div id="listaDeDados" class="flex flex-col gap-3">
                </div>

            </div>

        </div>

    </div>


    <script>
        const userId = sessionStorage.getItem("userID");
        const taskInput = document.getElementById("tarefa");
        const taskForm = taskInput.closest("form");
        const taskList = document.getElementById("listaDeDados");
        const taskError = document.getElementById("taskError");
        const submitButton = document.getElementById("criar");
        let tasks = [];
        let editingTaskId = null;

        if (!userId) {
            window.location.replace("login.html");
        } else {
            document.getElementById("userLabel").textContent =
                `Olá, ${sessionStorage.getItem("userName") || sessionStorage.getItem("email")}`;
            loadTasks();
        }

        document.getElementById("logout").addEventListener("click", () => {
            sessionStorage.clear();
            window.location.replace("login.html");
        });

        async function loadTasks() {
            try {
                const savedTasks = await OnlineStorage.get(OnlineStorage.tasksStorageKey(userId), []);
                if (!Array.isArray(savedTasks)) {
                    throw new Error("Os dados de tarefas salvos na API estão inválidos.");
                }

                tasks = savedTasks;
                renderTasks();
            } catch (error) {
                showTaskError(error.message);
            }
        }

        function showTaskError(message) {
            taskError.textContent = message;
            taskError.hidden = false;
        }

        function clearTaskError() {
            taskError.textContent = "";
            taskError.hidden = true;
        }

        function renderTasks() {
            taskList.replaceChildren();
            const completedCount = tasks.filter(task => task.completed).length;
            const pendingCount = tasks.length - completedCount;
            document.getElementById("taskCount").textContent =
                `${tasks.length} ${tasks.length === 1 ? "tarefa" : "tarefas"}`;
            document.getElementById("taskProgress").textContent = tasks.length
                ? `${pendingCount} pendente${pendingCount === 1 ? "" : "s"} · ${completedCount} concluída${completedCount === 1 ? "" : "s"}`
                : "Sua lista começa aqui";

            if (tasks.length === 0) {
                const emptyState = document.createElement("div");
                emptyState.className = "text-center rounded-2xl border border-dashed border-slate-600 bg-slate-800/60 px-5 py-10";

                const icon = document.createElement("i");
                icon.className = "ph-bold ph-check-square-offset text-3xl text-cyan-400";
                icon.setAttribute("aria-hidden", "true");

                const title = document.createElement("p");
                title.className = "text-slate-200 font-medium mt-3";
                title.textContent = "Nenhuma tarefa por enquanto";

                const description = document.createElement("p");
                description.className = "text-sm text-slate-400 mt-1";
                description.textContent = "Adicione uma tarefa acima para começar.";

                emptyState.append(icon, title, description);
                taskList.append(emptyState);
                return;
            }

            tasks.forEach(task => {
                const card = document.createElement("div");
                card.className = `group flex items-center gap-3 w-full rounded-2xl border p-4 transition duration-200 hover:-translate-y-0.5 hover:shadow-lg ${
                    task.completed
                        ? "border-slate-700 bg-slate-800/70"
                        : "border-slate-700 bg-slate-800 hover:border-cyan-800 hover:bg-slate-800/90"
                }`;

                const statusButton = createActionButton(
                    task,
                    "status",
                    task.completed ? "ph-check-circle" : "ph-circle",
                    task.completed ? "Marcar como pendente" : "Marcar como concluída",
                    task.completed
                        ? "text-emerald-400 hover:text-emerald-300"
                        : "text-slate-500 hover:text-cyan-300"
                );
                statusButton.className += " shrink-0 text-2xl transition";
                card.append(statusButton);

                const content = document.createElement("div");
                content.className = "min-w-0 flex-1";

                const title = document.createElement("p");
                title.className = `break-words font-medium ${
                    task.completed ? "text-slate-400 line-through" : "text-slate-100"
                }`;
                title.textContent = task.name;

                const status = document.createElement("p");
                status.className = `text-xs mt-1 ${
                    task.completed ? "text-emerald-400" : "text-slate-500"
                }`;
                status.textContent = task.completed ? "Concluída" : "Pendente";
                content.append(title, status);
                card.append(content);

                const actions = document.createElement("div");
                actions.className = "flex shrink-0 gap-1";
                const editButton = createActionButton(
                    task,
                    "edit",
                    "ph-pencil-simple",
                    "Editar tarefa",
                    "text-slate-400 hover:bg-slate-700 hover:text-cyan-300"
                );
                const deleteButton = createActionButton(
                    task,
                    "delete",
                    "ph-trash",
                    "Excluir tarefa",
                    "text-slate-400 hover:bg-red-950 hover:text-red-300"
                );
                editButton.className += " text-lg p-2 rounded-lg transition";
                deleteButton.className += " text-lg p-2 rounded-lg transition";
                actions.append(editButton, deleteButton);
                card.append(actions);
                taskList.append(card);
            });
        }

        function createActionButton(task, action, icon, label, color) {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.action = action;
            button.dataset.id = task.id;
            button.setAttribute("aria-label", label);
            button.className = `text-white p-2 rounded ${color}`;

            const iconElement = document.createElement("i");
            iconElement.className = `ph-bold ${icon}`;
            button.append(iconElement);
            return button;
        }

        taskForm.addEventListener("submit", async event => {
            event.preventDefault();
            clearTaskError();
            const name = taskInput.value.trim();

            if (!name) {
                showTaskError("Digite o nome da tarefa.");
                return;
            }

            const updatedTasks = editingTaskId
                ? tasks.map(task => task.id === editingTaskId ? { ...task, name } : task)
                : [...tasks, { id: OnlineStorage.createId(), name, completed: false }];

            try {
                await OnlineStorage.set(OnlineStorage.tasksStorageKey(userId), updatedTasks);
                tasks = updatedTasks;
                editingTaskId = null;
                taskInput.value = "";
                submitButton.innerHTML = '<i class="ph-bold ph-plus"></i>';
                submitButton.title = "Adicionar tarefa";
                renderTasks();
            } catch (error) {
                showTaskError(error.message);
            }
        });

        taskList.addEventListener("click", async event => {
            const button = event.target.closest("button[data-action]");
            if (!button) {
                return;
            }

            const task = tasks.find(item => item.id === button.dataset.id);
            if (!task) {
                return;
            }

            if (button.dataset.action === "edit") {
                editingTaskId = task.id;
                taskInput.value = task.name;
                submitButton.innerHTML = '<i class="ph-bold ph-check"></i>';
                submitButton.title = "Salvar edição";
                taskInput.focus();
                return;
            }

            clearTaskError();
            const updatedTasks = button.dataset.action === "delete"
                ? tasks.filter(item => item.id !== task.id)
                : tasks.map(item => item.id === task.id ? { ...item, completed: !item.completed } : item);

            try {
                await OnlineStorage.set(OnlineStorage.tasksStorageKey(userId), updatedTasks);
                tasks = updatedTasks;
                if (editingTaskId === task.id) {
                    editingTaskId = null;
                    taskInput.value = "";
                    submitButton.innerHTML = '<i class="ph-bold ph-plus"></i>';
                    submitButton.title = "Adicionar tarefa";
                }
                renderTasks();
            } catch (error) {
                showTaskError(error.message);
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
    <script src="assets/js/supabase.js"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
</head>

<body class="bg-slate-700 min-h-screen px-4 py-10">

    <!-- CONTAINER PRINCIPAL -->
    <div class="w-full max-w-md mx-auto bg-slate-800 shadow-lg rounded-lg overflow-hidden border border-slate-700">

        <div class="px-6 py-8">

            <!-- CABEÇALHO -->
            <div class="text-center mb-8">

                <i class="ph-bold ph-check-circle text-cyan-400 text-4xl"></i>

                <h1
                    class="text-3xl mt-3 font-bold bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Lista de Tarefas
                </h1>

                <p class="text-slate-400 mt-2">
                    Organize suas tarefas
                </p>

            </div>


            <!-- CAMPO DE NOVA TAREFA -->
            <div class="mb-8">

                <label for="tarefa" class="block text-slate-300 mb-2">
                    Nova tarefa
                </label>

                <div class="flex items-center border-b-2 border-cyan-800 py-2">

                    <i class="ph-bold ph-pencil-simple text-cyan-400 mr-3"></i>

                    <input
                        placeholder="Digite sua tarefa..."
                        type="text"
                        name="tarefa"
                        id="tarefa"
                        class="appearance-none bg-transparent border-none w-full text-slate-100 mr-3 py-1 px-2 leading-tight focus:outline-none placeholder-slate-500">

                    <button
                        id="criar"
                        class="flex-shrink-0 bg-cyan-800 hover:bg-cyan-700 text-white p-2 rounded-lg transition"
                        title="Adicionar tarefa">

                        <i class="ph-bold ph-plus"></i>

                    </button>

                    <button
                        hidden
                        id="confirmEdit"
                        class="flex-shrink-0 bg-cyan-800 hover:bg-cyan-700 text-white p-2 rounded-lg transition"
                        title="Confirmar edição">

                        <i class="ph-bold ph-check"></i>

                    </button>

                </div>

            </div>


            <!-- LISTA DE TAREFAS -->
            <div>

                <div class="flex items-center justify-between mb-4">

                    <h2 class="text-lg font-semibold text-slate-200">
                        Minhas tarefas
                    </h2>

                    <span class="text-sm text-slate-500">
                        Tarefas
                    </span>

                </div>

                <div id="listaDeDados" class="flex flex-col gap-3">
                </div>

            </div>

        </div>

    </div>


    <script>
        var tarefas = []
        let idTarefa = tarefas.length

        document.getElementById("criar").addEventListener("click", criarTarefa);

        async function criarTarefa() {
            // let tarefa = document.getElementById("tarefa").value
            // let idTarefa = tarefas.length

            // if (tarefa == "") {
            //     alert("Digite a tarefa!")
            //     return
            // }

            // tarefas.push([idTarefa, tarefa, true])

            // mostrarLista()
            // document.getElementById("tarefa").value = ""

            let tarefa = document.getElementById("tarefa").value

            const { data, error } = await supabaseClient
                .from('tasks')
                .insert([
                    { name: tarefa, id_user: sessionStorage.getItem("userID"), status: false }
                ])

            if (error) {
                console.error('Erro ao criar tarefa:', error)
            } else {
                console.log('Tarefa criada com sucesso:', data)
            }



            return
        }

        function mostrarLista() {
            let listaDeDados = document.getElementById("listaDeDados");

            listaDeDados.innerHTML = ``

            tarefas.forEach(function (tarefa) {
                let icon = ''
                if (tarefa[2] == true) {
                    icon = `<i id="btnStatus${tarefa[0]}" class="ph-bold ph-check-circle btnStatus"></i>`
                } else {
                    icon = `<i id="btnStatus${tarefa[0]}" class="ph-bold ph-circle btnStatus"></i>`
                }

                listaDeDados.innerHTML += `
                    <div  class="flex justify-between items-center w-80 border-5 p-2 border-gray-800 rounded-lg rounded-lg shadow-lg bg-gradient-to-r from-blue-500 via-blue-400 to-blue-500">
                        
                        <span class="text-black font-bold px-3">
                            ${tarefa[1]}
                        </span>
                            
                        <div class="flex gap-2">
                            <button 
                                id="btnStatus${tarefa[0]}"  
                                class="btn bg-green-700 hover:bg-green-900 text-white p-2 rounded btnStatus">                             
                                ${icon}
                            </button>

                            <button 
                            id="btnEdit${tarefa[0]}"  
                            class="btn bg-blue-700 hover:bg-blue-900 text-white p-2 rounded btnEdit">    
                                <i id="btnEdit${tarefa[0]}" class="ph-bold ph-pencil-simple btnEdit"></i>
                            </button>

                            <button 
                            id="btnDelete${tarefa[0]}"
                            class="btn bg-red-700 hover:bg-red-900 text-white p-2 rounded btnDelete">    
                                <i id="btnDelete${tarefa[0]}" class="ph-bold ph-trash btnDelete"></i>
                            </button>
                        </div>

                    </div>
                `;
            });
        }

        document.getElementById("listaDeDados").addEventListener("click", function (event) {

            if (event.target.classList.contains("btnEdit")) {
                edit(event.target);
            }

        });

        function edit(elemento) {
            const id = elemento.id
            const idOnlyNumber = id.replace("btnEdit", '')

            const posicao = tarefas.findIndex(
                item => item[0] === Number(idOnlyNumber)
            );

            console.log(posicao, 'posicao')
            if (posicao === -1) {
                console.log("Tarefa não encontrada");
                return;
            }

            // console.log("tarefa Editada: " + tarefas[posicao][1]);

            document.getElementById("tarefa").value = tarefas[posicao][1]

            document.getElementById("confirmEdit").removeAttribute("hidden")

            document.getElementById("btnDelete" + idOnlyNumber).setAttribute("hidden", true)

            document.getElementById("criar").setAttribute("hidden", true)

            document.getElementById("btnStatus" + idOnlyNumber).setAttribute("hidden", true)

            document.getElementById("tarefa").setAttribute("idTarefaEdicao", posicao)
        }

        document.getElementById("confirmEdit").addEventListener("click", confirmEdit);

        function confirmEdit() {
            const idTarefa = document.getElementById("tarefa").getAttribute("idTarefaEdicao");

            if (document.getElementById("tarefa").value == "") {
                alert("Digite a tarefa!")
                return
            }

            tarefas[idTarefa][1] = document.getElementById("tarefa").value

            document.getElementById("criar").removeAttribute("hidden")
            document.getElementById("confirmEdit").setAttribute("hidden", true)

            mostrarLista()
            document.getElementById("tarefa").value = ""
            return
        }

        document.getElementById("listaDeDados").addEventListener("click", function (event) {

            if (event.target.classList.contains("btnStatus")) {
                updateStatus(event.target);
            }
        });

        function updateStatus(idTarefa) {
            const id = idTarefa.id;
            const idOnlyNumber = id.replace("btnStatus", "");

            const posicao = tarefas.findIndex(
                item => item[0] === Number(idOnlyNumber)
            );

            if (posicao === -1) {
                console.log("Tarefa não encontrada");
                return;
            }

            if (tarefas[posicao][2] === true) {
                tarefas[posicao][2] = false;
            } else {
                tarefas[posicao][2] = true;
            }


            mostrarLista();
        }

        document.getElementById("listaDeDados").addEventListener("click", function (event) {

            if (event.target.classList.contains("btnDelete")) {
                deleteTarefa(event.target);
            }

        });

        function deleteTarefa(idTarefa) {
            const id = idTarefa.id;
            const idOnlyNumber = parseInt(id.replace("btnDelete", ''));

            console.log("deletar:", idOnlyNumber);

            tarefas = tarefas.filter(tarefa => tarefa[0] !== idOnlyNumber);

            console.log("task:", tarefas);

            mostrarLista();
        }

    </script>

</body>

</html>

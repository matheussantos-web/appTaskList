<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lista de Tarefas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
    <script src="assets/js/supabase.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
</head>

<body class="bg-slate-700 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-slate-800 shadow-lg rounded-lg overflow-hidden border border-slate-700">

        <div class="px-6 py-8">

            <!-- Título -->
            <div class="text-center mb-8">
                <i class="ph-bold ph-check-circle text-cyan-400 text-4xl"></i>

                <h1
                    class="text-3xl mt-3 font-bold bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Lista de Tarefas
                </h1>

                <p class="text-slate-400 mt-2">
                    Entre na sua conta
                </p>
            </div>

            <!-- Formulário -->
            <form id="loginForm">

                <div class="mb-5">
                    <label for="email" class="block text-slate-300 mb-2">
                        E-mail
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-envelope text-cyan-400 mr-3"></i>

                        <input type="email" id="email" placeholder="Digite seu e-mail" required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label for="senha" class="block text-slate-300 mb-2">
                        Senha
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-lock text-cyan-400 mr-3"></i>

                        <input type="password" id="password" placeholder="Digite sua senha" required
                            class="appearance-none bg-transparent border-none w-full text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-cyan-800 hover:bg-cyan-700 text-white font-medium py-3 rounded-lg transition">
                    <i class="ph-bold ph-sign-in mr-2"></i>
                    Entrar
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-slate-400">
                    Ainda não possui uma conta?
                </p>

                <a href="register.html" class="inline-block mt-2 text-cyan-400 hover:text-cyan-300 font-medium">
                    Criar uma conta
                </a>
            </div>

        </div>

    </div>

    <script>
        async function loginUser() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            console.log("Email:", email);
            console.log("Senha:", password);

            event.preventDefault();

            const resultado = await supabaseClient
                .from("users")
                .select()
                .eq('email', email)


            if (resultado.data.length > 0 && resultado.data[0].password === password) {
                console.log("Login bem-sucedido!");
                sessionStorage.setItem("email", email);
                sessionStorage.setItem("userID", resultado.data[0].id);
                window.location.href = "appTaskList.html";
            } else {
                alert("Credenciais inválidas. Por favor, verifique seu email e senha.");
                console.log("Credenciais inválidas.");
            }

            console.log("Resultado:", resultado);

        }
    </script>

</body>

</html>

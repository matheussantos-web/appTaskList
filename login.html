<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lista de Tarefas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="assets/js/api.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
</head>

<body class="bg-slate-700 min-h-screen flex items-start sm:items-center justify-center px-3 py-6 sm:px-4 sm:py-8">

    <div id="app" class="w-full max-w-md bg-slate-800 shadow-lg rounded-2xl overflow-hidden border border-slate-700">

        <div class="px-5 py-6 sm:px-6 sm:py-8">

            <!-- Título -->
            <div class="text-center mb-8">
                <i class="ph-bold ph-check-circle text-cyan-400 text-4xl"></i>

                <h1
                    class="text-2xl sm:text-3xl mt-3 font-bold bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Lista de Tarefas
                </h1>

                <p class="text-slate-400 mt-2">
                    Entre na sua conta
                </p>
               
            </div>

            <!-- Formulário -->
            <p v-if="error" role="alert" class="text-red-300 text-sm mb-4">{{ error }}</p>
            <form @submit.prevent="submitLogin">

                <div class="mb-5">
                    <label for="email" class="block text-slate-300 mb-2">
                        E-mail
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-envelope text-cyan-400 mr-3"></i>

                        <input type="email" id="email" placeholder="Digite seu e-mail" required v-model="email"
                            class="appearance-none bg-transparent border-none w-full min-w-0 text-base text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-slate-300 mb-2">
                        Senha
                    </label>

                    <div class="flex items-center border-b-2 border-cyan-800 py-2">
                        <i class="ph-bold ph-lock text-cyan-400 mr-3"></i>

                        <input type="password" id="password" placeholder="Digite sua senha" required v-model="password"
                            class="appearance-none bg-transparent border-none w-full min-w-0 text-base text-slate-100 placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit" :disabled="submitting"
                    class="w-full min-h-12 bg-cyan-800 hover:bg-cyan-700 text-white font-medium py-3 rounded-lg transition">
                    <i class="ph-bold ph-sign-in mr-2"></i>
                    Entrar
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-slate-400">
                    Ainda não possui uma conta?
                </p>

                <a href="register.html" class="inline-block mt-2 text-cyan-400 hover:text-cyan-300 font-medium">
                    Criar uma conta
                </a>
            </div>

        </div>

    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return { email: "", password: "", error: "", submitting: false };
            },
            methods: {
                async submitLogin() {
                    this.error = "";
                    this.submitting = true;
                    const email = this.email.trim().toLowerCase();

                    try {
                        const user = await OnlineStorage.get(OnlineStorage.accountStorageKey(email), null);
                        if (!user || !user.salt || !user.passwordHash) {
                            throw new Error("E-mail ou senha inválidos.");
                        }

                        const passwordHash = await OnlineStorage.hashPassword(this.password, user.salt);
                        if (!OnlineStorage.passwordsMatch(passwordHash, user.passwordHash)) {
                            throw new Error("E-mail ou senha inválidos.");
                        }

                        sessionStorage.setItem("email", email);
                        sessionStorage.setItem("userID", user.id);
                        sessionStorage.setItem("userName", user.name);
                        window.location.href = "index.html";
                    } catch (error) {
                        this.error = error.message;
                    } finally {
                        this.submitting = false;
                    }
                }
            }
        }).mount("#app");
    </script>

</body>

</html>
